<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boarding House Electricity</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123b63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BH Electricity">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
:root{--navy:#123b63;--blue:#1769aa;--green:#159a72;--red:#dc2626;--bg:#f1f5f9;--mut:#64748b;--card:#fff;--text:#172033;--soft:#f8fafc;--chip:#e2e8f0;--line:#e2e8f0;--line2:#cbd5e1;--track:#dbe3ed;--accent:#123b63;--ok:#166534;--err:#b91c1c;color-scheme:light}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--soft:#273449;--chip:#334155;--line:#334155;--line2:#475569;--track:#334155;--mut:#94a3b8;--accent:#7cc0ff;--ok:#4ade80;--err:#f87171;color-scheme:dark}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
header h2{margin:0;font-size:20px}header small{opacity:.85}
#topMenu{width:44px;height:44px;margin:0;background:#ffffff22;font-size:22px;padding:0}
main{max-width:720px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000c}
.alert{background:var(--card);border:2px solid var(--red);border-radius:14px;padding:14px;margin-bottom:14px}
.alert b{color:var(--err);font-size:17px}
h3{margin:0 0 8px}
input,select,button,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
input[type=checkbox]{width:auto;margin:0 8px 0 0;transform:scale(1.3)}
button{background:var(--blue);color:#fff;border:0;font-weight:bold;cursor:pointer}
button.sec{background:var(--chip);color:var(--text)}button.danger{background:var(--red)}
button:disabled{opacity:.5}
.muted{color:var(--mut);font-size:13px}.error{color:var(--err)}.success{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:10px}.stat .l{font-size:12px;color:var(--mut)}.stat .v{font-size:18px;font-weight:bold}
.value{font-size:22px;font-weight:bold}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:bold;margin:0 6px 6px 0;color:#fff;background:var(--mut)}
.pill.g{background:var(--green)}.pill.r{background:var(--red)}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green)}
.item{border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}.item:last-child{border:0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.seg{margin:10px 0}
.chip{background:var(--chip);color:var(--text);margin:0}.chip.on{background:var(--blue);color:#fff}
.comp .stat{background:var(--card);margin-top:6px}.comp{background:var(--soft);border-radius:10px;padding:12px;margin:10px 0}.total{font-size:20px;font-weight:bold;color:var(--accent)}
.chk{display:flex;align-items:center;padding:8px 0;font-size:16px}
